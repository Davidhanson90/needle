name: Benchmark regression

# Benchmarks the pull request and its base commit alternately on the SAME runner (so hardware differences
# cancel out), takes the median of several rounds and fails when a benchmark is meaningfully slower.
# See docs/benchmarks.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Allowed slowdown in percent before failing'
        required: false
        default: '25'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: compare against base
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCH_TOLERANCE_PERCENT: ${{ inputs.tolerance || vars.BENCH_TOLERANCE_PERCENT || '25' }}
      BENCH_ROUNDS: ${{ vars.BENCH_ROUNDS || '3' }}
    steps:
    - name: Checkout pull request
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Checkout base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        path: base
    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: npm
    - run: npm ci
    - run: npm ci
      working-directory: base
    - name: Unit tests for the comparison script
      run: npm run test:bench-compare
    - name: Benchmark base and pull request (alternating rounds)
      run: node scripts/bench-ab.mjs --base base --rounds "$BENCH_ROUNDS" --tolerance "$BENCH_TOLERANCE_PERCENT"
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bench-ab
        path: reports/bench-ab
        if-no-files-found: ignore

  baseline:
    name: record main baseline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: npm
    - run: npm ci
    - run: npm run bench:report
    - name: Upload main baseline
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bench-main-${{ github.sha }}
        path: reports/bench
        retention-days: 90
